name: Deploy to ops.impostmedia.com

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies (Runner)
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Tailwind/Vite
        run: npm run build

      - name: Copy build ke server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          source: 'public/build'
          target: '/home/u465920647/domains/impostmedia.com/public_html/ops.impostmedia.com/public'
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          timeout: 60s
          command_timeout: 60m
          script: |
            set -e
            APP=/home/u465920647/domains/impostmedia.com/public_html/ops.impostmedia.com
            REPO=https://${{ secrets.GH_TOKEN }}@github.com/akmlrhim/operation-impostmedia.git

            PHP=$(command -v php8.3 2>/dev/null \
              || command -v php83 2>/dev/null \
              || command -v php 2>/dev/null)

            echo "Menggunakan PHP: $PHP ($($PHP -r 'echo PHP_VERSION;'))"

            # Pastikan ekstensi PHP yang dibutuhkan tersedia
            $PHP -m | grep -qE 'pdo_mysql|pdo_sqlite|mbstring|openssl' \
              && echo "Ekstensi PHP OK" \
              || echo "!! Cek ekstensi PHP (pdo_mysql, mbstring, openssl)"

            if [ ! -d "$APP/.git" ]; then
              echo "Pertama kali — setup repository..."
              mkdir -p $APP
              cd $APP
              git init
              git remote add origin $REPO
              git fetch origin main
              git reset --hard origin/main

              # Pastikan .env sudah dibuat manual; auto-generate APP_KEY bila kosong
              if [ ! -f "$APP/.env" ]; then
                echo "!! .env belum ada — buat manual dulu: cp .env.example .env"
                exit 1
              fi
              grep -q '^APP_KEY=$' "$APP/.env" && {
                $PHP artisan key:generate --force
                echo "APP_KEY digenerate otomatis (kosong)."
              } || echo "APP_KEY sudah terisi."

              COMPOSER_MEMORY_LIMIT=-1 composer install \
                --no-interaction --prefer-dist --optimize-autoloader --no-dev --no-scripts

              $PHP artisan package:discover --ansi
              $PHP artisan migrate --force
              $PHP artisan storage:link || true
              chmod -R 775 storage bootstrap/cache
              echo "Setup awal selesai."
            else
              echo "Update — pulling latest code..."
              cd $APP
              $PHP artisan down || true

              git pull $REPO main
              git reset --hard FETCH_HEAD

              COMPOSER_MEMORY_LIMIT=-1 composer install \
                --no-interaction --prefer-dist --optimize-autoloader --no-dev --no-scripts

              $PHP artisan package:discover --ansi
              $PHP artisan migrate --force
              $PHP artisan optimize:clear
            fi

            cd $APP
            $PHP artisan config:cache
            $PHP artisan route:cache
            $PHP artisan event:cache
            $PHP artisan view:cache
            chmod -R 775 storage bootstrap/cache

            # Restart queue worker (Pusher/Laravel Echo + notifikasi)
            if [ -x "$(command -v supervisorctl)" ]; then
              supervisorctl restart laravel-worker:* || true
            else
              # Fallback: temukan proses queue lama & jalankan ulang di background
              pkill -f "artisan queue:work" 2>/dev/null || true
              nohup $PHP artisan queue:work --daemon --tries=3 >/dev/null 2>&1 </dev/null &
            fi

            $PHP artisan up
            echo "Deploy sukses: $(date)"

name: Deploy to ops.impostmedia.com

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-to-ops
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Tailwind/Vite
        run: npm run build

      - name: Copy build ke server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          source: 'public/build'
          target: '/home/u465920647/domains/impostmedia.com/public_html/ops.impostmedia.com/public'
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          timeout: 60s
          command_timeout: 20m
          script: |
            set -euo pipefail

            APP=/home/u465920647/domains/impostmedia.com/public_html/ops.impostmedia.com
            REPO=https://${{ secrets.GH_TOKEN }}@github.com/akmlrhim/operation-impostmedia.git

            PHP=$(command -v php8.3 2>/dev/null || command -v php83 2>/dev/null || command -v php 2>/dev/null)
            if [ -z "$PHP" ]; then
              echo "!! PHP tidak ditemukan."
              exit 1
            fi

            log() { echo "== $*"; }
            php_up() { $PHP "$APP/artisan" up --force >/dev/null 2>&1 || true; }
            trap php_up EXIT

            log "PHP: $($PHP -r 'echo PHP_VERSION;')"

            if [ ! -d "$APP/.git" ]; then
              log "Setup pertama — inisialisasi repository..."
              mkdir -p "$APP"
              cd "$APP"
              git init -q
              git remote add origin "$REPO"
            fi

            if [ ! -f "$APP/.env" ]; then
              echo "!! $APP/.env belum ada — buat manual: cp .env.example .env && php artisan key:generate"
              exit 1
            fi

            log "Masuk maintenance mode..."
            $PHP "$APP/artisan" down --retry=120 >/dev/null 2>&1 || true

            cd "$APP"

            log "Menarik kode terbaru..."
            git fetch -q origin main
            git reset --hard -q FETCH_HEAD

            log "Menginstal dependensi Composer..."
            COMPOSER_MEMORY_LIMIT=-1 composer install \
              --no-interaction --prefer-dist --optimize-autoloader --no-dev --no-progress

            log "package:discover"
            $PHP artisan package:discover --ansi

            log "Migrasi database..."
            $PHP artisan migrate --force

            # Generate APP_KEY bila kosong.
            APP_KEY_VALUE=$(
              sed -n 's/^APP_KEY=//p' "$APP/.env" | head -n1 | tr -d '[:space:]"\r'
            )
            if [ -z "$APP_KEY_VALUE" ]; then
              log "APP_KEY kosong — generate otomatis..."
              $PHP artisan key:generate --force
            fi

            log "Memastikan storage:link ada..."
            $PHP artisan storage:link || true

            log "Membangun cache config/rute/event/view..."
            $PHP artisan optimize

            # Worker di-restart via sinyal, bukan di-background manual di sesi SSH ini.
            # Butuh Supervisor terpasang sekali di server (lihat catatan di bawah).
            log "Me-restart queue worker (via Supervisor)..."
            $PHP artisan queue:restart

            log "Membuka akses publik kembali..."
            php_up
            trap - EXIT

            log "Deploy selesai: $(date)"
